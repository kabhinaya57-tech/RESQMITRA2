name: Build ResQMitra Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ResQMitra Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find Flutter project
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC_PATH="$(find . -type f -name pubspec.yaml -not -path './.git/*' -not -path '*/.dart_tool/*' -print -quit)"
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "ERROR: Could not find pubspec.yaml anywhere in the repository. Make sure the Flutter project files were uploaded."
            exit 1
          fi
          FLUTTER_PROJECT_DIR="$(dirname "$PUBSPEC_PATH")"
          echo "Flutter project found at: $FLUTTER_PROJECT_DIR"
          echo "FLUTTER_PROJECT_DIR=$FLUTTER_PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Ensure Android platform exists
        shell: bash
        run: |
          set -euo pipefail
          cd "$FLUTTER_PROJECT_DIR"
          if [ ! -d android ]; then
            echo "No android/ folder found. Generating the Android platform files..."
            flutter create --platforms=android .
          fi
          if [ ! -d android ]; then
            echo "ERROR: Android platform folder is still missing."
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: |
          cd "$FLUTTER_PROJECT_DIR"
          flutter pub get

      - name: Analyze Dart code
        shell: bash
        run: |
          cd "$FLUTTER_PROJECT_DIR"
          flutter analyze

      - name: Build release APK
        shell: bash
        run: |
          cd "$FLUTTER_PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: resqmitra-release-apk
          path: ${{ env.FLUTTER_PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
